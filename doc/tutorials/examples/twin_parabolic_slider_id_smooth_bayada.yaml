options:
    output: /tmp/twin_parabolic_slider_id_smooth_bayada
    write_freq: 5
    save_output: False
    output_plots: False

grid:
    Lx: 0.0762
    Ly: 0.004
    Nx: 80
    Ny: 1
    xW: ['D', 'N', 'N']
    xE: ['N', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_P: 3.36414e5
    xE_P: 1e3

geometry:
    type: inclined      # placeholder — overwritten by regen_twin_parabolic_slider_id
    hmax: 50.2e-6
    hmin: 25.4e-6
    U: 4.57
    V: 0.
    flip: false

numerics:
    solver: fem
    dt: 0.1
    tol: 0.
    max_it: 550

properties:
    rho0: 850.
    EOS: Bayada
    rho_l: 850.0
    rho_v: 0.019
    c_l: 1600.0
    c_v: 352.0
    shear: 0.039
    bulk: 0.0
    p_cav: -1.

fem_solver:
    linear_solver: direct
    newton_relax: 0.001
    physics:
        gap_shear: true
        plane_shear: false
        inertia: false
    stabilization:
        mass_supg: true
    equations:
        cavitation: true
    max_iter: 10
    R_norm_tol: 0.
    scaling: True
