options:
    output: /tmp/circular_bayada
    write_freq: 1
    save_output: False
    output_plots: False

grid:
    Lx: 0.002
    Ly: 0.002
    Nx: 128
    Ny: 128
    xW: ['D', 'N', 'N']
    xE: ['N', 'N', 'N']
    yS: ['N', 'N', 'N']
    yN: ['N', 'N', 'N']
    xW_D: 850.0
    xE_D: 850.0
    yS_D: 850.0
    yN_D: 850.0

geometry:
    type: circular_contact
    Rx: 15.0e-3
    Ry: 15.0e-3
    hmin: 1.0e-6
    U: 10.
    flip: false

numerics:
    solver: fem
    dt: 1.
    tol: 0.
    max_it: 90

properties:
    EOS: Bayada
    rho0: 850.
    rho_l: 850.0
    rho_v: 0.019
    c_l: 1600.0
    c_v: 352.0
    shear: 0.039
    bulk: 0.
    elastic:
        enabled: true
        E: 210.0e9
        nu: 0.3
        alpha_underrelax: 0.1
        reference_point: [0, 25]
        n_images: 0

force_balance:
    force: 25
    pid_hold_tol: 0.05
    init_dry_contact:
        enabled: true
        domain_inlet: 4.5
        domain_outlet: 1.5
        domain_sides: 3.0
    rigid_height_variation:
        enabled: true
        method: bisection
        init_min_height:
        ambient_pressure: 0.0
        force_tol: 0.01
        h_min_step_divisor: 50.0

fem_solver:
    linear_solver: direct
    newton_relax: 0.2
    physics:
        gap_shear: true
        plane_shear: true
        inertia: false
    max_iter: 5
    R_norm_tol: 1.0e-9
    scaling: false
