options:
    output: /tmp/twin_parabolic_slider_bayada
    write_freq: 2
    save_output: False
    output_plots: False

grid:
    Lx: 0.09
    Ly: 0.004
    Nx: 200
    Ny: 4
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_D: 850.
    xE_D: 850.

geometry:
    type: inclined
    hmax: 6.0e-5
    hmin: 3.0e-5
    U: 2.
    V: 0.
    flip: false

numerics:
    solver: fem
    dt: 0.08
    tol: 0.
    max_it: 50

properties:
    rho0: 850.
    EOS: Bayada
    rho_l: 850.0
    rho_v: 0.019
    c_l: 1600.0
    c_v: 352.0
    shear: 0.039
    bulk: 0.0

fem_solver:
    linear_solver: direct
    newton_relax: 0.01
    physics:
        gap_shear: true
        plane_shear: false
        inertia: false
    max_iter: 20
    R_norm_tol: 0.
    scaling: True
