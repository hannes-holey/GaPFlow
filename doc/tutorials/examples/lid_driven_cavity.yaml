options:
    output: data/lid_driven_cavity
    write_freq: 1
    save_output: True
    output_plots: True
    silent: False

grid:
    Lx: 1.0
    Ly: 1.0
    Nx: 50
    Ny: 50
    # West wall: impermeable, stationary
    xW: ['N', 'D', 'D']
    xW_D: [null, 0.0, 0.0]
    # East wall: impermeable, stationary
    xE: ['N', 'D', 'D']
    xE_D: [null, 0.0, 0.0]
    # South wall: impermeable, stationary
    yS: ['N', 'D', 'D']
    yS_D: [null, 0.0, 0.0]
    # North wall (lid): impermeable, moving lid — actual velocity set via BC callback
    yN: ['N', 'D', 'D']
    yN_D: [null, 0.0, 0.0]

geometry:
    type: inclined
    hmin: 1.0
    hmax: 1.0
    U: 0.0
    V: 0.0

numerics:
    solver: fem
    dt: 10.
    tol: 5e-07
    max_it: 10

properties:
    EOS: PL
    rho0: 1.0
    P0: 1.0
    shear: 0.5
    bulk: 0.0
    alpha: 1e-3
    force_x: 0.0
    force_y: 0.0

fem_solver:
    R_norm_tol: 1e-8
    max_iter: 2
    alpha: 0.3
    linear_solver: direct
    physics:
        gap_shear: False
        plane_shear: True
        inertia: True
        mass_supg: True
        mass_supg_type: 'flux'
    scaling: true
