options:
    output: /tmp/parabolic_slider_bayada
    write_freq: 10
    save_output: False
    output_plots: False

grid:
    Lx: 0.0762
    Ly: 0.004
    Nx: 128
    Ny: 2
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_D: 850.
    xE_D: 850.

geometry:
    type: parabolic
    hmin: 2.54e-5
    hmax: 5.08e-5
    U: 4.57
    V: 0.

numerics:
    solver: fem
    dt: 0.5
    tol: 0.0
    max_it: 70

properties:
    P0: 1e5
    rho0: 850.
    EOS: Bayada
    rho_l: 850.0
    rho_v: 0.019
    c_l: 1600.0
    c_v: 352.0
    shear: 0.039
    bulk: 0.0

fem_solver:
    linear_solver: direct
    newton_relax: 0.01
    physics:
        gap_shear: true
        plane_shear: false
        inertia: false
    max_iter: 10
    R_norm_tol: 1e-9
    scaling: False
