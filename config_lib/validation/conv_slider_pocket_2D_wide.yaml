# 2D Convergent slider with pocket — wide domain (Ly=300 mm, pocket width=210 mm)
#
# Same geometry as conv_slider_pocket_2D but with a much wider domain to study
# the effect of domain width. Pocket is centred in y (45 mm margin each side).
#
# Geometry: linear convergent wedge (hmax=1.1 µm at inlet, hmin=1.0 µm at outlet)
#   plus a rectangular pocket (depth=0.4 µm) at x=[4 mm, 10 mm], y=[45 mm, 255 mm] (w=210 mm, centred).
#
# Domain: Lx = 0.020 m, Ly = 0.300 m
#
# Fluid: Dowson-Higginson EOS
#   p_cav = 0 Pa  (vacuum cavitation)
#   shear = 0.01 Pa·s (Bertocchi mu0, constant)
#
# Wall velocity: U = 1.0 m/s (upper wall), lower wall stationary
# BCs: p = 1e5 Pa at inlet/outlet/yS/yN

options:
    output: /tmp/conv_slider_pocket_2D_wide
    write_freq: 10
    save_output: False
    output_plots: False
    residual_analysis: False

grid:
    Lx: 0.020
    Ly: 0.300
    Nx: 240
    Ny: 60
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['D', 'N', 'N']
    yN: ['D', 'N', 'N']
    xW_P: 1e5
    xE_P: 1e5
    yS_P: 1e5
    yN_P: 1e5

geometry:
    type: inclined      # placeholder — overwritten by regen_conv_slider_pocket_2d_wide in notebook
    hmax: 1.1e-6
    hmin: 1.0e-6
    U: 1.0
    V: 0.0
    flip: false

numerics:
    solver: fem
    dt: 2.0
    tol: 0.0
    max_it: 8

properties:
    EOS: DH
    rho0: 850.
    P0: 1e5
    C1: 6.22e9
    C2: 1.66
    p_cav: 0.0
    shear: 0.01
    bulk: 0.0
    piezo:
        name: Barus
        aB: 1.2e-8

fem_solver:
    linear_solver: direct
    newton_relax: 0.15
    equations:
        cavitation: True
    physics:
        gap_shear: true
        inertia: false
    stabilization:
        oss: true
        ad: false
        oss_alpha: 1.
        ad_alpha: 0.00002
    max_iter: 5
    R_norm_tol: 1e-9
    scaling: False
