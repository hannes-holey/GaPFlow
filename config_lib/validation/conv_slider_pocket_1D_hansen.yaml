options:
    output: /tmp/conv_slider_pocket_1D_hansen
    write_freq: 5
    save_output: False
    print_config: False
    output_plots: False
    residual_analysis: False

grid:
    Lx: 0.010
    Ly: 0.1
    Nx: 200
    Ny: 1
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_P: 1e5
    xE_P: 1e5

geometry:
    type: inclined      # placeholder — overwritten by regen_conv_slider_pocket_1d_hansen in notebook
    hmax: 1.05e-6
    hmin: 1.0e-6
    U: 1.0
    V: 0.0
    flip: false

numerics:
    solver: implicit
    dt: 0.1
    tol: 1e-11
    max_it: 70

properties:
    EOS: DH
    rho_ref: 850.
    P0: 2e5
    C1: 20e9
    C2: 1.66
    p_cav: 0.0
    shear: 0.01
    bulk: 0.0

implicit_solver:
    linear_solver: direct
    newton_relax: 0.1
    equations:
        cavitation: True
    physics:
        gap_shear: true
        inertia: false
    stabilization:
        oss: true
        oss_factor: 1.0
        upg: true
        upg_factor: 1.0
    max_it: 2
    tol_abs_resnorm: 1e-9
    scaling: True
