options:
    output: data/scripting
    save_output: False
    print_config: False
    write_freq: 1

grid:
    Lx: 0.02
    Ly: 0.02
    Nx: 24
    Ny: 24
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_P: 101325
    xE_P: 101325

geometry:
    type: parabolic_2d
    hmin: 1.e-5
    hmax: 2.e-5
    U: 1.0
    V: 0.0

numerics:
    solver: implicit
    dt: 0.1
    max_it: 20
    tol: 0.

properties:
    EOS: DH
    rho_ref: 877.7007
    P0: 101325
    C1: 3.5e10
    C2: 1.23
    shear: 0.039
    bulk: 0.0

implicit_solver:
    physics:
        squeeze: True
