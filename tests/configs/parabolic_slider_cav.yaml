# Parabolic slider bearing — Fischer-Burmeister cavitation
#
# Geometry: parabolic gap, hmin=2.54e-5 m, hmax=5.08e-5 m, U=4.57 m/s
# Dirichlet p=0 at inlet/outlet, periodic in y (effectively 1D).
#
# Fluid: Dowson-Higginson EOS
#   rho0 = 877.7 kg/m³  at  P0 = 101325 Pa
#   p_cav = 0 Pa
#   shear = 0.039 Pa·s

options:
    output: /tmp/parabolic_slider
    write_freq: 10
    save_output: False
    output_plots: False
    residual_analysis: False

grid:
    Lx: 0.0762
    Ly: 0.004
    Nx: 256
    Ny: 4
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_P: 1e05
    xE_P: 0

geometry:
    type: parabolic
    hmin: 2.54e-5
    hmax: 5.08e-5
    U: 4.57
    V: 0.

numerics:
    solver: fem
    dt: 0.1
    tol: 0.0
    max_it: 50

properties:
    EOS: DH
    rho0: 877.7007
    P0: 101325
    C1: 3.5e10
    C2: 1.23
    p_cav: 0
    shear: 0.039
    bulk: 0.0

fem_solver:
    linear_solver: direct
    newton_relax: 0.1
    p_init: 103338.25
    equations:
        cavitation: True
    physics:
        gap_shear: true
    stabilization:
        oss: true
        oss_alpha: 1.0
        mass_supg: false
        mass_supg_factor: 1.0
    max_iter: 1
    R_norm_tol: 1e-9
    scaling: True
