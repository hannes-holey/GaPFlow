options:
    output: /tmp/bernoulli_quasi1d
    write_freq: 1
    save_output: False
    print_config: False

grid:
    Lx: 0.1
    Ly: 0.005
    Nx: 200
    Ny: 1
    xW: ['D', 'N', 'N']
    xW_D: [1000.0, 0.0, 0.0]
    xE: ['N', 'D', 'D']
    xE_D: [0., 5000.0, 0.0]
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']

geometry:
    type: inclined
    hmin: 0.0005
    hmax: 0.001
    U: 0.0
    V: 0.0

numerics:
    solver: implicit
    dt: 1.0
    tol: 1.0e-10
    max_it: 100

properties:
    shear: 0.1894
    bulk: 0.
    EOS: DH
    P0: 101325.
    rho0: 1000.
    T0: 323.15
    C1: 3.5e08
    C2: 1.23

implicit_solver:
    newton_relax: 0.5
    tol_abs_resnorm: 1.0e-10
    linear_solver: direct
    max_it: 5
    physics:
        gap_shear: False
        plane_shear: False
        inertia: True
