options:
    output: /tmp/twin_parabolic_slider_id
    write_freq: 50
    save_output: False
    output_plots: False
    residual_analysis: False

grid:
    Lx: 0.0762
    Ly: 0.004
    Nx: 100
    Ny: 1
    xW: ['D', 'N', 'N']
    xE: ['N', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_P: 3.36414e5
    xE_P: 1e3

geometry:
    type: inclined
    hmax: 50.2e-6
    hmin: 25.4e-6
    U: 4.57
    V: 0.0
    flip: false

numerics:
    solver: fem
    dt: 0.1
    tol: 0.0
    max_it: 200

properties:
    EOS: DH
    rho0: 400.
    P0: 1e5
    C1: 2.22e9
    C2: 1.66
    p_cav: 0.0
    shear: 0.039
    bulk: 0.0

fem_solver:
    linear_solver: direct
    newton_relax: 0.2
    equations:
        cavitation: True
    physics:
        gap_shear: true
    stabilization:
        oss: false
        oss_alpha: 0.0
        mass_supg: true
        mass_supg_factor: 1.0
    max_iter: 1
    R_norm_tol: 1e-9
    scaling: False
