options:
    output: /tmp/twin_parabolic_slider
    write_freq: 10
    save_output: False
    output_plots: False
    residual_analysis: False

grid:
    Lx: 0.09
    Ly: 0.004
    Nx: 200
    Ny: 2
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_D: 877.7008
    xE_D: 877.7008

geometry:
    type: inclined      # placeholder — overwritten by regen_twin_parabolic_slider in notebook
    hmax: 6.0e-5
    hmin: 3.0e-5
    U: 2.0
    V: 0.0
    flip: false

numerics:
    solver: fem
    dt: 0.08
    tol: 0.0
    max_it: 100

properties:
    EOS: DH
    rho0: 877.7008
    P0: 101325
    C1: 3.5e10
    C2: 1.23
    p_cav: 0.2e05
    shear: 0.039
    bulk: 0.0

fem_solver:
    linear_solver: direct
    newton_relax: 0.1
    equations:
        cavitation: True
    physics:
        gap_shear: true
    stabilization:
        oss: true
        oss_alpha: 1.0
        mass_supg: false
        mass_supg_factor: 1.0
    max_iter: 1
    R_norm_tol: 1e-9
    scaling: False
