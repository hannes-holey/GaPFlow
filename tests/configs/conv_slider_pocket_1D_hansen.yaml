# 1D Convergent slider with pocket — Fischer-Burmeister cavitation
#
# Geometry from Hansen et al., Tribology Letters 70 (2022), 80.
#   Table 3: Lx=10 mm, inlet a=2 mm, pocket b=3 mm (x=[2,5] mm), outlet 5 mm.
#
# Domain: Lx = 10 mm, periodic in y (effectively 1D).
# Gap: linear convergent wedge (hmax=1.05 µm at inlet, hmin=1.0 µm at outlet)
#      plus a rectangular pocket (depth=1.0 µm, x=[2 mm, 5 mm]).
#
# Fluid: Dowson-Higginson EOS (same as Bertocchi 1D case)
#   p_cav = 0 Pa  (vacuum cavitation)
#   shear = 0.01 Pa·s
#
# Wall velocity: U = 1.0 m/s (upper wall), lower wall stationary
# BCs: p_in = p_out = 1e5 Pa

options:
    output: /tmp/conv_slider_pocket_1D_hansen
    write_freq: 2
    save_output: False
    output_plots: False
    residual_analysis: False

grid:
    Lx: 0.010
    Ly: 0.1
    Nx: 200
    Ny: 1
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_P: 1e5
    xE_P: 1e5

geometry:
    type: inclined      # placeholder — overwritten by regen_conv_slider_pocket_1d_hansen in notebook
    hmax: 1.05e-6
    hmin: 1.0e-6
    U: 1.0
    V: 0.0
    flip: false

numerics:
    solver: fem
    dt: 0.1
    tol: 0.0
    max_it: 70

properties:
    EOS: DH
    rho0: 850.
    P0: 2e5
    C1: 20e9
    C2: 1.66
    p_cav: 0.0
    shear: 0.01
    bulk: 0.0

fem_solver:
    linear_solver: direct
    newton_relax: 0.05
    equations:
        cavitation: True
    physics:
        gap_shear: true
        inertia: false
    stabilization:
        oss: true
        oss_alpha: 1.0
        mass_supg: true
        mass_supg_factor: 1.0
    max_iter: 2
    R_norm_tol: 1e-9
    scaling: True
