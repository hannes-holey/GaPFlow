# Parabolic slider bearing — solver comparison template
#
# Geometry: parabolic gap, hmin=2.54e-5 m, hmax=5.08e-5 m, U=4.57 m/s
# Dirichlet density BC at inlet/outlet, periodic in y (effectively 1D).
#
# Fluid: Dowson-Higginson EOS
#   rho0 = 877.7 kg/m³  at  P0 = 101325 Pa
#   shear = 0.039 Pa·s

options:
    output: /tmp/parabolic_slider_{solver}
    write_freq: 1
    save_output: False
    output_plots: False
    print_config: False

grid:
    Lx: 0.0762
    Ly: 0.004
    Nx: 100
    Ny: 1
    xW: ['D', 'N', 'N']
    xE: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xW_D: {rho_bc}
    xE_D: {rho_bc}

geometry:
    type: parabolic
    hmin: 2.54e-5
    hmax: 5.08e-5
    U: 4.57
    V: 0.

numerics:
    solver: {solver}
    dt: 1.0
    tol: 1e-13

properties:
    EOS: DH
    rho0: 877.7007
    P0: 101325
    C1: 3.5e10
    C2: 1.23
    shear: 0.039
    bulk: 0.0

fem_solver:
    alpha: 1.0
