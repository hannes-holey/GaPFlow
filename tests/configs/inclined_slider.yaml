options:
    output: /tmp/inclined_slider_{solver}
    write_freq: 1
    save_output: False
    print_config: False

grid:
    Lx: 0.1
    Ly: 0.1
    Nx: 300
    Ny: 1
    xE: ['D', 'N', 'N']
    xW: ['D', 'N', 'N']
    yS: ['P', 'P', 'P']
    yN: ['P', 'P', 'P']
    xE_D: 1.1853
    xW_D: 1.1853

geometry:
    type: inclined
    hmax: 6.6e-5
    hmin: 1.0e-5
    U: 50.
    V: 0.

numerics:
    solver: {solver}
    dt: 1.0
    tol: 1e-08

properties:
    EOS: PL
    shear: 1.846e-5
    bulk: 0.
    P0: 101325
    rho0: 1.1853
    alpha: 0.

fem_solver:
    alpha: 1.0
